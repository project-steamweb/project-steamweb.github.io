  <title>Steam Atlas · 蒸汽图鉴</title>

  <div class="ambient" aria-hidden="true">
    <div class="ambient-orb ambient-orb-a"></div>
    <div class="ambient-orb ambient-orb-b"></div>
    <div class="ambient-grid"></div>
    <div class="grain"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="侧边栏">
      <a class="brand" href="#/" aria-label="Steam Atlas 首页">
        <span class="brand-mark" aria-hidden="true">
          <span class="brand-ring"></span>
          <span class="brand-core"></span>
        </span>
        <span class="brand-type"><b>STEAM</b><em>ATLAS</em></span>
      </a>

      <nav class="side-nav">
        <a class="nav-item" data-nav="home" href="#/">
          <span class="nav-icon"><svg><use href="#i-compass"></use></svg></span>
          <span class="nav-label">探索</span>
          <span class="nav-index">01</span>
        </a>
        <a class="nav-item" data-nav="prices" href="#/prices">
          <span class="nav-icon"><svg><use href="#i-globe"></use></svg></span>
          <span class="nav-label">全球区价</span>
          <span class="nav-index">02</span>
        </a>
        <a class="nav-item" data-nav="profile" href="#/profile">
          <span class="nav-icon"><svg><use href="#i-user"></use></svg></span>
          <span class="nav-label">玩家档案</span>
          <span class="nav-index">03</span>
        </a>
      </nav>

      <div class="side-section" id="recent-section" hidden>
        <div class="side-label"><span>最近查看</span><i></i></div>
        <div class="recent-list" id="recent-list"></div>
      </div>

      <div class="side-bottom">
        <button class="side-region" id="region-button" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span class="region-code" id="side-region-code">CN</span>
          <span class="side-region-copy"><b id="side-region-name">中国</b><small id="side-region-currency">CNY · 人民币</small></span>
          <svg class="chevron"><use href="#i-chevron-down"></use></svg>
        </button>
        <div class="side-key">
          <span class="key-icon"><svg><use href="#i-key"></use></svg></span>
          <span class="side-key-copy"><b>Steam API</b><small id="side-key-status">公开模式</small></span>
          <span class="status-dot" id="key-dot"></span>
        </div>
        <div class="side-credit">
          <span>DATA BY STEAM</span>
          <span>NOT AFFILIATED</span>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu-button" id="menu-button" type="button" aria-label="打开菜单">
            <svg><use href="#i-menu"></use></svg>
          </button>
          <div class="breadcrumb" id="breadcrumb"><span>探索</span></div>
        </div>
        <div class="topbar-actions">
          <form class="global-search js-search-form" id="global-search-form" role="search" autocomplete="off">
            <svg class="search-icon"><use href="#i-search"></use></svg>
            <input id="global-search-input" name="q" type="search" placeholder="搜索游戏或 App ID" aria-label="搜索 Steam 游戏">
            <kbd>/</kbd>
            <div class="suggest-panel" id="global-suggest" hidden></div>
          </form>
          <button class="region-chip" id="region-chip" type="button" aria-haspopup="dialog" aria-expanded="false">
            <span id="region-chip-code">CN</span>
            <span class="region-chip-divider"></span>
            <span id="region-chip-currency">CNY</span>
            <svg><use href="#i-chevron-down"></use></svg>
          </button>
          <div class="api-chip" id="api-chip" role="status" aria-label="Steam API 状态">
            <span class="status-dot" id="api-chip-dot"></span>
            <span id="api-chip-label">官方 API</span>
          </div>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="footer">
        <div class="footer-brand">
          <span class="brand-mark small" aria-hidden="true"><span class="brand-ring"></span><span class="brand-core"></span></span>
          <span>Steam Atlas <i>蒸汽图鉴</i></span>
        </div>
        <p>非 Valve 官方产品。游戏资料、价格与玩家信息均来自 Steam 公开服务，仅供查询参考。</p>
        <div class="footer-links">
          <a href="https://store.steampowered.com/" target="_blank" rel="noopener noreferrer">Steam 商店 <svg><use href="#i-arrow-up-right"></use></svg></a>
          <span>v1.0.9</span>
        </div>
      </footer>
    </div>
  </div>

  <div class="region-popover" id="region-popover" hidden>
    <div class="popover-head">
      <div><span class="eyebrow">STORE REGION</span><h3>选择价格区服</h3></div>
      <button class="icon-button" id="region-close" type="button" aria-label="关闭"><svg><use href="#i-close"></use></svg></button>
    </div>
    <div class="region-list" id="region-list"></div>
    <p class="popover-note">区服决定搜索、精选与本地定价的显示货币。全球比价始终覆盖全部 16 个区服。</p>
  </div>

  <dialog class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭图片"><svg><use href="#i-close"></use></svg></button>
    <figure>
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/app.js?v=1.0.9"></script>
</body>
</html>
